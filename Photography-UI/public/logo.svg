  <!-- 媒体符号 -->
  <polygon points="20,45 28,49 20,53" fill="white" opacity="0.8"/>
  <rect x="30" y="46" width="14" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="30" y="50" width="10" height="2" rx="1" fill="white" opacity="0.8"/>
</svg>
